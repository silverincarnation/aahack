[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
bytes = "1.12.2"
hashbrown = "0.17.1"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.1.0", default-features = false }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "ss"
path = "src/main.rs"
